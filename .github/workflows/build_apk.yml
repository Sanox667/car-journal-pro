name: Build Flet APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flet & Build APK
        run: |
          pip install flet
          echo "y" | flet build apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarJournal-APK
          path: build/apk/*.apk
